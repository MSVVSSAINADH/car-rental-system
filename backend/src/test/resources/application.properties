spring.application.name=backend-test
spring.datasource.url=jdbc:h2:mem:testdb;DB_CLOSE_DELAY=-1;MODE=MySQL;LOCK_TIMEOUT=10000;NON_KEYWORDS=YEAR
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.H2Dialect
server.port=0
# JwtUtil refuses to start with a secret shorter than 32 bytes.
app.jwt.secret=test-only-jwt-secret-value-that-is-long-enough
app.cors.allowed-origins=http://localhost:7050

